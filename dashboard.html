<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Desk · PAPER memecoin terminal</title>
<style>
:root{--bg:#07080b;--p1:#0e1015;--p2:#13161d;--p3:#1a1e27;--bd:#1f2430;--tx:#e6e8ee;--mu:#7c8394;--dim:#4c5262;
--gr:#16c784;--rd:#f0465a;--yl:#f5b941;--bl:#4c8dff;--pk:#ff5fb0;--pu:#9b7bff;--gray:#9aa1ad}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
font:13px/1.35 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.mono,.num{font-family:ui-monospace,"JetBrains Mono",SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
.up{color:var(--gr)}.dn{color:var(--rd)}.mu{color:var(--mu)}.dim{color:var(--dim)}
#app{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr);height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:18px;padding:8px 14px;background:var(--p1);border-bottom:1px solid var(--bd);overflow-x:auto;white-space:nowrap}
.logo{font-weight:800;letter-spacing:.3px;font-size:15px;display:flex;align-items:center;gap:8px}
.logo i{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,#4c8dff,#9b7bff);display:inline-block}
.badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.5px}
.b-paper{background:#3a2a05;color:var(--yl);border:1px solid #6b4d0a}
.kpi{display:flex;flex-direction:column;gap:1px}.kpi .l{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.6px}
.kpi .v{font-size:14px;font-weight:600}.kpi .v.big{font-size:18px}
.sep{width:1px;height:28px;background:var(--bd)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;box-shadow:0 0 8px currentColor}
main{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
aside{border-left:1px solid var(--bd);background:var(--p1);display:flex;flex-direction:column;min-height:0}
.card{background:var(--p1);border:1px solid var(--bd);border-radius:10px;min-width:0}
.ch{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--bd);font-weight:600;font-size:12.5px}
.ch .cnt{background:var(--p3);color:var(--mu);border-radius:10px;padding:0 7px;font-size:11px;font-weight:600}
.ch .r{margin-left:auto;font-weight:400;color:var(--mu);font-size:11px}
.row1{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1fr);gap:10px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.col .list{height:560px;overflow:auto}
.tok{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:9px;padding:9px 11px;border-bottom:1px solid #161a22;cursor:default}
.tok:hover{background:var(--p2)}
.av{width:42px;height:42px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.t1{display:flex;align-items:baseline;gap:6px;min-width:0}.t1 b{font-size:13.5px}.t1 .nm{color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.t2,.t3{display:flex;gap:4px 8px;flex-wrap:wrap;font-size:11px;color:var(--mu);margin-top:3px}.t2 span b{color:var(--tx);font-weight:500}
.chip{font-size:10px;padding:0 5px;line-height:16px;border-radius:4px;background:var(--p3);color:var(--gray);white-space:nowrap}
.c-g{background:rgba(22,199,132,.12);color:var(--gr)}.c-r{background:rgba(240,70,90,.13);color:var(--rd)}
.c-y{background:rgba(245,185,65,.13);color:var(--yl)}.c-b{background:rgba(76,141,255,.14);color:var(--bl)}.c-p{background:rgba(255,95,176,.13);color:var(--pk)}
.rt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.rt .mc{font-size:12px;color:var(--mu)}.rt .mc b{color:var(--tx);font-size:13px}
.lnk{display:flex;gap:4px;margin-top:4px}.lnk a{font-size:10px;color:var(--mu);border:1px solid var(--bd);border-radius:4px;padding:0 5px}
.lnk a:hover{color:var(--tx);border-color:var(--mu)}
.verdict{font-weight:700;font-size:10.5px;padding:2px 7px;border-radius:4px;letter-spacing:.4px}
.v-APPROVED{background:rgba(22,199,132,.15);color:var(--gr)}.v-WAIT{background:rgba(245,185,65,.15);color:var(--yl)}.v-BLOCKED{background:rgba(240,70,90,.15);color:var(--rd)}
table{width:100%;border-collapse:collapse;font-size:12px}th{font-weight:500;color:var(--mu);text-align:left;padding:6px 10px;border-bottom:1px solid var(--bd);font-size:11px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;background:var(--p1)}
td{padding:6px 10px;border-bottom:1px solid #161a22;white-space:nowrap}td.wrap{white-space:normal;color:var(--mu);min-width:220px}
.tbl{max-height:340px;overflow:auto}
.stats{padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.stat .l{font-size:10.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}.stat .v{font-size:16px;font-weight:600}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--p3);margin-top:4px}
.reasons{padding:2px 12px 10px}.reasons div{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:3px 0;border-bottom:1px dashed #1b1f29}
.reasons div span:first-child{color:var(--gray);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.health{padding:8px 12px 12px;display:flex;flex-direction:column;gap:5px;font-size:11.5px}
.health div{display:flex;justify-content:space-between;gap:8px}
#eqsvg{width:100%;height:220px}#eqsvg svg{display:block}
details.deb{border-bottom:1px solid #161a22}details.deb summary{list-style:none;display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer}
details.deb summary::-webkit-details-marker{display:none}details.deb[open] summary{background:var(--p2)}
.deb .body{padding:6px 12px 12px 12px;background:#0b0d12}
.msg{display:flex;gap:8px;padding:5px 0}.msg .ra{width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.msg .bb{background:var(--p2);border:1px solid var(--bd);border-radius:4px 10px 10px 10px;padding:5px 9px;min-width:0;flex:1}
.msg .hd{display:flex;gap:6px;align-items:baseline;font-size:11.5px}.msg .hd .tm{margin-left:auto;color:var(--dim);font-size:10.5px}
.msg .tx{font-size:12.5px;white-space:pre-wrap;word-break:break-word;margin-top:1px}
#chat{flex:1;overflow:auto;padding:4px 10px 10px}
.legend{display:flex;gap:8px;flex-wrap:wrap;padding:6px 12px;border-bottom:1px solid var(--bd);font-size:11px;font-weight:600}
.filt{display:flex;gap:4px}.filt button{background:var(--p3);color:var(--mu);border:1px solid var(--bd);border-radius:5px;font-size:10.5px;padding:1px 7px;cursor:pointer}
.filt button.on{color:var(--tx);border-color:var(--mu)}
.prog{height:4px;background:var(--p3);border-radius:2px;margin-top:5px;overflow:hidden}.prog div{height:100%;background:linear-gradient(90deg,#9b7bff,#16c784)}
.empty{padding:18px;color:var(--dim);text-align:center}
.pill{font-size:10px;color:var(--mu)}
.row2{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#262b37;border-radius:4px}::-webkit-scrollbar-track{background:transparent}
@media (max-width:1100px){#app{grid-template-columns:1fr;height:auto}aside{height:70vh}main{overflow:visible}.row1,.cols,.row2{grid-template-columns:1fr}}
#pubbar{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;background:#10151c;border-bottom:1px solid #2a3344;font:12.5px/1.35 Inter,ui-sans-serif,system-ui,sans-serif;color:#e6e8ee}#pubbar.ok{background:#0d1c14;border-bottom-color:#1a5c38}#pubbar.stale{background:#2a1216;border-bottom-color:#f0465a;color:#ffd0d4}#pubbar .tag{font-weight:800;letter-spacing:.4px;font-size:10px;padding:2px 6px;border-radius:4px}#pubbar .tag.ok{background:#163d28;color:#16c784}#pubbar .tag.stale{background:#5a1520;color:#ff8a96}#app{padding-top:42px}
</style></head><body><div id="pubbar" role="status">Lade Stand…</div><div id="app">
<header id="top"></header>
<main id="main"></main>
<aside><div class="ch">Group chat <span class="cnt" id="chatcnt"></span><span class="r">8 bots · live feed</span></div>
<div class="legend" id="legend"></div><div id="chat"></div></aside>
</div>
<script id="data" type="application/json">null</script>
<script>
const ROLE={Scout:"#4c8dff","Live Scout":"#ff7a45",News:"#f5b941",Wallets:"#2dd4bf",Sentiment:"#ff5fb0",Charts:"#16c784",Skeptic:"#9aa1ad",Chief:"#f3f4f6",Desk:"#9b7bff"};
const ROLE_TX={Chief:"#111"};
let D=JSON.parse(document.getElementById("data").textContent||"null");
const UI=JSON.parse(sessionStorage.getItem("deskUI")||'{"open":{},"scanF":"all","scroll":{}}');
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sub=n=>String(n).split("").map(d=>"₀₁₂₃₄₅₆₇₈₉"[d]).join("");
function px(v){if(v==null||isNaN(v))return"–";v=+v;if(v===0)return"$0";if(v>=1000)return"$"+v.toLocaleString("en-US",{maximumFractionDigits:0});
 if(v>=1)return"$"+v.toFixed(v>=100?2:3);if(v>=0.001)return"$"+v.toFixed(5).replace(/0+$/,"");
 const s=v.toExponential(3);const [m,e]=s.split("e");const z=-parseInt(e)-1;return"$0.0"+sub(z)+m.replace(".","").slice(0,4);}
function big(v){if(v==null||isNaN(v))return"–";v=+v;const a=Math.abs(v);return(v<0?"-":"")+"$"+(a>=1e9?(a/1e9).toFixed(2)+"B":a>=1e6?(a/1e6).toFixed(2)+"M":a>=1e3?(a/1e3).toFixed(1)+"K":a.toFixed(0));}
const usd=(v,d=2)=>v==null?"–":(v<0?"-$":"$")+Math.abs(v).toFixed(d);
const sgn=(v,d=2)=>v==null?"–":(v>=0?"+":"-")+"$"+Math.abs(v).toFixed(d);
const pct=(v,d=1)=>v==null||isNaN(v)?"–":(v>=0?"+":"")+(+v).toFixed(d)+"%";
const cls=v=>v>0?"up":v<0?"dn":"mu";
function age(min){if(min==null)return"–";if(min<60)return Math.round(min)+"m";if(min<1440)return(min/60).toFixed(min<600?1:0)+"h";if(min<525600)return Math.round(min/1440)+"d";return(min/525600).toFixed(1)+"y";}
const ago=t=>t?age((Date.now()/1000-t)/60):"–";
const tm=t=>t?new Date(t*1000).toLocaleTimeString("de-AT",{timeZone:"Europe/Vienna",hour:"2-digit",minute:"2-digit",second:"2-digit"}):"–";
const dt=t=>t?new Date(t*1000).toLocaleString("de-AT",{timeZone:"Europe/Vienna",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"–";
function hue(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h;}
function avatar(sym,mint,logo){const h=hue(mint||sym);return`<div class="av" style="background:linear-gradient(135deg,hsl(${h} 65% 42%),hsl(${(h+50)%360} 70% 28%))">${esc((sym||"?").slice(0,1).toUpperCase())}${logo?`<img src="${esc(logo)}" loading="lazy" onerror="this.remove()">`:""}</div>`;}
const links=(pool,mint)=>`<div class="lnk"><a target=_blank href="https://dexscreener.com/solana/${pool||mint}">DEX</a><a target=_blank href="https://solscan.io/token/${mint}">SOL</a><a target=_blank href="https://rugcheck.xyz/tokens/${mint}">RUG</a></div>`;
function safetyChips(s,holders){if(!s)return`<span class="chip">safety unchecked</span>`;const o=[];
 o.push(`<span class="chip ${s.mint_auth?"c-r":"c-g"}">${s.mint_auth?"✕":"✓"} mint</span>`);
 o.push(`<span class="chip ${s.freeze_auth?"c-r":"c-g"}">${s.freeze_auth?"✕":"✓"} freeze</span>`);
 o.push(s.top10==null?`<span class="chip">top10 n/a</span>`:`<span class="chip ${s.top10>50?"c-r":s.top10>35?"c-y":"c-g"}">top10 ${s.top10.toFixed(0)}%</span>`);
 o.push(`<span class="chip ${s.lp_locked>=90?"c-g":s.lp_locked>0?"c-y":"c-r"}">LP ${(s.lp_locked||0).toFixed(0)}%</span>`);
 if(holders)o.push(`<span class="chip">👥 ${holders.toLocaleString()}</span>`);return o.join("");}
function walletChips(r){const w=r.wallets,o=[];if(r.early)o.push(`<span class="chip c-p">EARLY · curve ${r.progress!=null?Math.round(r.progress*100)+"%":"?"}</span>`);if(!w)return o.join("");
 if(w.smart_n)o.push(`<span class="chip c-g">🧠 smart ${w.smart_n} · ${big(w.smart_usd)}</span>`);
 if(w.dev_pct!=null)o.push(`<span class="chip ${w.dev_pct>10?"c-r":w.dev_pct>3?"c-y":""}">dev ${w.dev_pct.toFixed(1)}%</span>`);
 if(w.dev_sold)o.push(`<span class="chip c-r">dev sold ${big(w.dev_sold)}</span>`);
 if(w.insiders)o.push(`<span class="chip ${(w.insider_pct||0)>10?"c-r":"c-y"}">insiders ${w.insiders}${w.insider_pct?" · "+w.insider_pct.toFixed(0)+"%":""}</span>`);
 if(w.launch_visible){o.push(`<span class="chip ${w.bundle_share>0.25?"c-r":w.bundle_share>0.1?"c-y":""}">bundle ${Math.round(w.bundle_share*100)}%</span>`);o.push(`<span class="chip ${w.sniper_share>0.3?"c-r":""}">snipers ${w.sniper_wallets}</span>`);}
 if(w.creator_tokens)o.push(`<span class="chip ${w.creator_tokens>=5?"c-r":""}">dev tokens ${w.creator_tokens}</span>`);
 if(w.large_n)o.push(`<span class="chip c-b">🐋 ${w.large_n} large buys</span>`);return o.join("");}
function radarCard(r){const n=(r.buys5||0)+(r.sells5||0),prog=r.progress==null?null:Math.round(r.progress*100);
 return`<div class="tok">${avatar(r.symbol,r.mint,r.logo)}<div style="min-width:0"><div class="t1"><b>${esc(r.symbol)}</b><span class="nm">${esc(r.name||"")}</span>${r.status==="flagged"?'<span class="chip c-p">flagged</span>':""}</div>
 <div class="t2 num"><span class="${(Date.now()/1000-r.created)<600?"up":""}">⏱ ${age((Date.now()/1000-r.created)/60)}</span><span>${px(r.price)}</span><span>5m <span class="up">${r.buys5||0}</span>/<span class="dn">${r.sells5||0}</span></span><span>V5m <b>${big(r.vol5)}</b></span><span class="${cls(r.chg5)}">${pct(r.chg5)}</span>${r.socials?`<span>🔗${r.socials}</span>`:'<span class="dim">no socials</span>'}</div>
 ${r.dex==="pumpfun"&&prog!=null?`<div class="prog"><div style="width:${prog}%"></div></div><div class="t3"><span>curve ~${prog}% (est.)</span>${r.flag_why?`<span class="chip c-p" title="${esc(r.flag_why)}">${esc(r.flag_why.split(":")[0])}</span>`:""}</div>`:`<div class="t3"><span class="chip c-g">migrated → ${esc(r.dex||"?")}</span></div>`}
 <div class="lnk"><a target=_blank href="https://dexscreener.com/solana/${r.pair||r.mint}">DEX</a><a target=_blank href="https://pump.fun/coin/${r.mint}">PUMP</a><a target=_blank href="https://rugcheck.xyz/tokens/${r.mint}">RUG</a></div></div>
 <div class="rt"><div class="mc">MC <b>${big(r.mcap)}</b></div><div class="pill">${n} tx/5m</div></div></div>`;}
function statusChip(st){if(!st)return"";if(st.startsWith("flagged"))return`<span class="chip c-b">${esc(st)}</span>`;
 if(st.startsWith("filtered"))return`<span class="chip" title="${esc(st)}">${esc(st.replace("filtered: ","").slice(0,34))}</span>`;
 if(st.startsWith("no spike"))return`<span class="chip">${esc(st)}</span>`;if(st==="holding")return`<span class="chip c-g">holding</span>`;return`<span class="chip c-y">${esc(st)}</span>`;}
function tokCard(r,mode){const tx=(r.buys_h1??r.buys??0),sx=(r.sells_h1??r.sells??0);
 const fdv=r.fdv_usd??r.fdv,liq=r.liquidity_usd??r.liq,price=r.price_usd??r.price;
 if(r.legacy)return`<div class="tok">${avatar(r.symbol,r.mint)}<div><div class="t1"><b>${esc(r.symbol)}</b><span class="nm">cycle ${r.cycle} · ${dt(r.t)}</span></div><div class="t2"><span class="dim">discussed before metrics were recorded</span></div>${links(null,r.mint)}</div><div class="rt"><span class="verdict v-${r.verdict}">${r.verdict||"?"}</span></div></div>`;
 const hype=r.sentiment?`<span class="chip c-p">hype ${r.sentiment.score}</span>`:"";
 const spike=r.spike?`<span class="chip c-b">vol ${(+r.spike).toFixed(1)}x</span>`:"";
 const cat=r.news?(r.news.real_catalyst?`<span class="chip c-g">catalyst</span>`:r.news.paid_only?`<span class="chip c-y">paid promo</span>`:`<span class="chip">no catalyst</span>`):"";
 const rr=r.chart?`<span class="chip ${r.chart.rr>=2?"c-g":"c-r"}">R:R ${(+r.chart.rr).toFixed(1)}</span>`:(mode==="dec"?`<span class="chip c-r">no chart</span>`:"");
 let right=`<div class="mc">MC <b>${big(fdv)}</b></div><div class="num ${cls(r.chg_h1)}" style="font-size:12px">${pct(r.chg_h1)} 1h</div>`;
 if(mode==="dec")right=`<span class="verdict v-${r.verdict}">${r.verdict||"?"}</span>`+right;
 return`<div class="tok">${avatar(r.symbol,r.mint,r.logo)}<div style="min-width:0"><div class="t1"><b>${esc(r.symbol)}</b><span class="nm">${esc((r.name||"").replace(/\s*\/.*$/,"")!==r.symbol?(r.name||""):"")}</span><span class="chip">${esc(r.dex||"")}</span>${r.graduated?`<span class="chip c-p">grad</span>`:""}</div>
 <div class="t2 num"><span class="${(r.age_min??999)<60?"up":""}">⏱ ${age(r.age_min)}</span><span>${px(price)}</span><span>L <b>${big(liq)}</b></span><span>V1h <b>${big(r.vol_h1)}</b></span><span class="${cls(r.chg_m5)}">5m ${pct(r.chg_m5)}</span><span><span class="up">${tx}</span>/<span class="dn">${sx}</span></span></div>
 <div class="t3">${mode==="scan"?statusChip(r.status)+spike:spike+hype+cat+rr}${mode!=="scan"?safetyChips(r.safety,r.holders):""}${mode!=="scan"?walletChips(r):""}</div>
 ${mode==="dec"&&r.action?`<div class="t3"><span class="mu">Chief:</span> <span style="color:${r.action.startsWith("BOUGHT")?"var(--gr)":"var(--gray)"}">${esc(r.action)}</span>${r.hard&&r.hard.length?` <span class="dn" title="${esc(r.hard.join(" | "))}">⛔ ${esc(r.hard[0].slice(0,60))}</span>`:""}</div>`:""}
 ${links(r.pool,r.mint)}</div><div class="rt">${right}<div class="pill">${mode==="scan"?esc(r.origin||""):tm(r.t)}</div></div></div>`;}
function eqChart(W){const h=D.equity||[];W=Math.max(320,W||900);const H=220,P={l:46,r:12,t:12,b:22};
 if(h.length<2)return`<div class="empty">equity curve appears after 2 cycles</div>`;
 const ts=h.map(x=>x[0]),vs=h.map(x=>x[1]),s0=D.kpi.start_usd;let lo=Math.min(...vs,s0),hi=Math.max(...vs,s0);const pad=(hi-lo)*.15||s0*.01;lo-=pad;hi+=pad;
 const X=t=>P.l+(t-ts[0])/((ts[ts.length-1]-ts[0])||1)*(W-P.l-P.r),Y=v=>P.t+(hi-v)/(hi-lo)*(H-P.t-P.b);
 const pts=h.map(x=>X(x[0]).toFixed(1)+","+Y(x[1]).toFixed(1)).join(" ");const last=vs[vs.length-1],col=last>=s0?"#16c784":"#f0465a";

const PUB_RAW="https://raw.githubusercontent.com/Jdhevdu/vw-kyhrvmtscjpdiiqo/main/dashboard.json";function fmtVienna(ts){if(!ts)return "–";const ms=ts>1e12?ts:ts*1000;const fmt=new Intl.DateTimeFormat("de-AT",{timeZone:"Europe/Vienna",weekday:"short",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});return fmt.format(new Date(ms))+" (Europe/Vienna)";}function updatePubBar(){const el=document.getElementById("pubbar");if(!el)return;const ts=D&&(D.generated||(D.status&&D.status.heartbeat));const age=ts?(Date.now()/1000-(ts>1e12?ts/1000:ts)):1e9;const interval=(D&&D.interval_s)?D.interval_s:120;const stale=age>interval*2+60;el.className=stale?"stale":"ok";const stand=fmtVienna(ts);let ageTxt="keine Daten";if(ts){if(age<90)ageTxt=Math.round(age)+"s";else if(age<3600)ageTxt=Math.round(age/60)+" Min.";else ageTxt=Math.round(age/3600)+" Std.";}el.innerHTML=stale?`<span class="tag stale">VERALTET</span><span>Letzter Stand: ${stand} (vor ${ageTxt}). Der Computer schläft oder die Übertragung ist gestoppt. Angezeigt wird der letzte Snapshot.</span>`:`<span class="tag ok">LIVE</span><span>Stand: ${stand} · aktualisiert vor ${ageTxt} · nur Spielgeld, keine Finanzberatung · <a href="chat.html" style="color:#9b7bff;text-decoration:underline">Chat</a>${D&&D.control&&D.control.url?` · <a href="control.html" style="color:#16c784;text-decoration:underline">Steuerung (Login)</a>`:""}</span>`;}async function fetchDashboard(){const qs="?"+Date.now();try{const r=await fetch("dashboard.json"+qs,{cache:"no-store"});if(r.ok)return await r.json();}catch(e){}return null;}async function poll(){try{const j=await fetchDashboard();if(j&&(!D||j.generated!==D.generated)){D=j;render();}updatePubBar();}catch(e){updatePubBar();if(location.protocol==="file:"){save();location.reload();}}}
